<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка моделей</title>
<style>
  :root {
    --bg: #14181d; --panel: #1c2128; --panel2: #232a33; --line: #2e3742;
    --text: #e3e8ee; --muted: #8b96a3; --accent: #4fb3c8; --ok: #5cc27a; --bad: #e8794f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-columns: 260px 1fr 340px; height: 100vh; overflow: hidden; }
  aside, section.notes { background: var(--panel); overflow-y: auto; }
  aside { border-right: 1px solid var(--line); padding: 10px 0; }
  section.notes { border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 15px; margin: 4px 14px 8px; }
  .progress { margin: 0 14px 10px; color: var(--muted); font-size: 12px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
  .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 14px 4px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 14px; cursor: pointer; border-left: 3px solid transparent; }
  .item:hover { background: var(--panel2); }
  .item.sel { background: var(--panel2); border-left-color: var(--accent); }
  .item small { color: var(--muted); margin-left: auto; font-size: 11px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; }
  .dot.ok { background: var(--ok); border-color: var(--ok); }
  .dot.bad { background: var(--bad); border-color: var(--bad); }
  main { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .title { background: rgba(20,24,29,.8); padding: 8px 12px; border-radius: 8px; }
  .title b { font-size: 16px; } .title div { color: var(--muted); font-size: 12px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 60%; }
  .tools label, .tools button { background: rgba(20,24,29,.85); border: 1px solid var(--line); color: var(--text);
    padding: 5px 9px; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; user-select: none; }
  .tools input { vertical-align: -2px; margin: 0 4px 0 0; }
  .help { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; background: rgba(20,24,29,.7); padding: 4px 8px; border-radius: 6px; }
  .nav { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 6px; }
  button { font: inherit; }
  .btn { background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .status { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .status .btn.on.ok { background: var(--ok); color: #0d1a12; border-color: var(--ok); }
  .status .btn.on.bad { background: var(--bad); color: #1f0d05; border-color: var(--bad); }
  textarea { width: 100%; min-height: 180px; flex: 1; resize: vertical; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--bg); border: 1px solid var(--line); color: var(--muted); padding: 3px 8px; border-radius: 12px; font-size: 12px; cursor: pointer; }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .warns:empty { display: none; }
  .warns { background: rgba(232,121,79,.12); border: 1px solid var(--bad); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  .warns b { color: var(--bad); display: block; margin-bottom: 4px; }
  .warns div + div { margin-top: 4px; }
  .lbl { color: var(--muted); font-size: 12px; }
  .report { background: var(--accent); color: #062026; border: 0; font-weight: 600; padding: 12px; border-radius: 8px; cursor: pointer; }
  .report:hover { filter: brightness(1.1); }
  .linkbtn { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; text-decoration: underline; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px); background: var(--ok); color: #0d1a12;
    padding: 10px 16px; border-radius: 8px; font-weight: 600; transition: transform .25s; z-index: 10; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  pre#fallback { display: none; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); padding: 8px; border-radius: 8px; font-size: 12px; max-height: 200px; overflow: auto; }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 180px 55vh auto; overflow: auto; height: auto; }
    main { height: 55vh; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>
</head>
<body>
<aside>
  <h1>Модели зданий</h1>
  <div class="progress"><span id="prog"></span><div class="bar"><i id="progbar"></i></div></div>
  <div id="list"></div>
</aside>

<main id="view">
  <div class="hud">
    <div class="title"><b id="mName"></b><div id="mInfo"></div></div>
    <div class="tools">
      <label><input type="checkbox" id="tPorts" checked>Порты (сокеты)</label>
      <label><input type="checkbox" id="tFoot" checked>Контур клеток</label>
      <label><input type="checkbox" id="tParts" checked>Подвижные детали</label>
      <label><input type="checkbox" id="tAnim">Анимация деталей</label>
      <label><input type="checkbox" id="tWire">Каркас</label>
      <label><input type="checkbox" id="tBack">Подсветить изнанку</label>
      <label><input type="checkbox" id="tGrid" checked>Сетка 1×1</label>
      <label><input type="checkbox" id="tSpin">Автоповорот</label>
      <button id="bReset">Сбросить камеру</button>
    </div>
  </div>
  <div class="help">ЛКМ — вращать · ПКМ — двигать · колесо — зум · ←/→ (или [ ]) — пред./след. модель</div>
  <div class="nav"><button class="btn" id="bPrev">← Пред.</button><button class="btn" id="bNext">След. →</button></div>
</main>

<section class="notes">
  <div class="warns" id="warns"></div>
  <div class="lbl">Состояние модели</div>
  <div class="status">
    <button class="btn ok" data-s="ok">✓ Всё ок</button>
    <button class="btn bad" data-s="bad">✗ Есть проблемы</button>
  </div>
  <div class="lbl">Быстрые пометки (добавляют строку в заметку)</div>
  <div class="chips" id="chips"></div>
  <div class="lbl">Что не так и что исправить</div>
  <textarea id="note" placeholder="Например: труба торчит сквозь крышу, порт смещён на полклетки влево, не хватает лестницы…"></textarea>
  <button class="report" id="bReport">Сформировать отчёт</button>
  <pre id="fallback"></pre>
  <button class="linkbtn" id="bClear">Очистить все заметки</button>
</section>
<div class="toast" id="toast">Отчёт скопирован в буфер обмена</div>

  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.font = 'bold 52px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.lineWidth = 6; x.strokeStyle = '#0b1a0d'; x.strokeText(n, 32, 34);
  x.fillStyle = '#73ff80'; x.fillText(n, 32, 34);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.position.set(0, 0.78, 0.05); s.scale.setScalar(0.3);
  return s;
}

// ---------- текущая модель ----------
const models = DATA.models;
let idx = 0, root = null, animParts = [];
const $ = id => document.getElementById(id);

function applyToggles() {
  if (!root) return;
  root.traverse(o => {
    if (o.userData.kind === 'back') o.visible = $('tBack').checked;
    if (o.userData.kind === 'wire') o.visible = $('tWire').checked;
    if (o.userData.part) o.visible = $('tParts').checked;
    if (o.userData.port) o.visible = $('tPorts').checked;
    if (o.userData.foot) o.visible = $('tFoot').checked;
  });
  if (grid) grid.visible = $('tGrid').checked;
  controls.autoRotate = $('tSpin').checked;
}

function frame(fit = true) {
  const box = new THREE.Box3().setFromObject(root.children[0]);
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.length() / 2, 0.3);
  controls.target.copy(c);
  if (fit) {
    const d = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05;
    camera.position.copy(c).add(new THREE.Vector3(1, 0.75, 1.15).normalize().multiplyScalar(d));
  }
  camera.near = r / 100; camera.far = r * 100; camera.updateProjectionMatrix();
  sun.position.copy(c).add(new THREE.Vector3(4, 7, 3).normalize().multiplyScalar(r * 4 + 4));
  sun.target.position.copy(c);
  const s = sun.shadow.camera, e = r * 1.6 + 1;
  s.left = s.bottom = -e; s.right = s.top = e; s.near = 0.1; s.far = r * 10 + 20; s.updateProjectionMatrix();
  if (grid) scene.remove(grid);
  const n = Math.max(4, Math.ceil(Math.max(size.x, size.z)) + 4);
  grid = new THREE.GridHelper(n, n, 0x4fb3c8, 0x3a4552);
  grid.position.set(n % 2 ? 0.5 : 0, 0, n % 2 ? 0.5 : 0);
  scene.add(grid);
  return size;
}

function show(i) {
  idx = (i + models.length) % models.length;
  const m = models[idx];
  if (root) scene.remove(root);
  root = new THREE.Group();
  const body = new THREE.Group();
  body.add(makeMesh(m.id));
  root.add(body);
  animParts = [];
  let tris = parseObj(m.id).tris;
  for (const p of m.parts) {
    const pg = makeMesh(p.model);
    pg.position.set(-p.pos[0], p.pos[1], p.pos[2]); // в OBJ ось X зеркальна относительно Unity
    pg.userData.part = true; pg.userData.anim = p.anim;
    root.add(pg); animParts.push(pg);
    tris += parseObj(p.model).tris;
  }
  scene.add(root);
  const size = frame(true);
  // габариты считаем вместе с деталями, но без портов
  const full = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3());
  // порты — как их ставит BuildingRestyle.AddPorts: на краю клетки, наружу по сокету
  for (const p of m.ports || []) {
    const pg = makeMesh(p.model);
    pg.position.set(-p.x, 0, p.z);
    pg.rotation.y = -THREE.MathUtils.degToRad(p.yaw);
    pg.userData.port = true;
    if (p.num) pg.add(numberSprite(p.num));
    root.add(pg);
  }
  if (m.size) {
    const [sx, sz] = m.size, g = new THREE.BufferGeometry();
    g.setFromPoints([[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => new THREE.Vector3(a * sx / 2, 0.005, b * sz / 2)));
    const ln = new THREE.LineLoop(g, new THREE.LineBasicMaterial({ color: 0xffd34d }));
    ln.userData.foot = true;
    root.add(ln);
  }
  $('warns').innerHTML = (m.warns || []).length
    ? '<b>⚠ Автопроверка сокетов</b>' + m.warns.map(w => `<div>${w.replace(/</g, '&lt;')}</div>`).join('') : '';
  $('mName').textContent = m.label;
  $('mInfo').textContent = `${m.id}.obj · ${full.x.toFixed(2)} × ${full.z.toFixed(2)} × ${full.y.toFixed(2)} м (Ш×Г×В) · ${tris} треуг.` +
    (m.size ? ` · клеток ${m.size[0]}×${m.size[1]}` : '') + (m.prefab ? ` · ${m.prefab}` : '') +
    (m.parts.length ? ` · детали: ${m.parts.map(p => p.model).join(', ')}` : '');
  applyToggles();
  renderList();
  renderNote();
}

// ---------- список и заметки ----------
function renderList() {
  const list = $('list');
  list.innerHTML = '';
  let cat = null;
  models.forEach((m, i) => {
    if (m.cat !== cat) { cat = m.cat; const h = document.createElement('div'); h.className = 'cat'; h.textContent = cat; list.append(h); }
    const n = notes[m.id] || {};
    const el = document.createElement('div');
    el.className = 'item' + (i === idx ? ' sel' : '');
    el.innerHTML = `<span class="dot ${n.s || ''}"></span><span></span>${n.t ? '<small>📝</small>' : ''}`;
    el.children[1].textContent = m.label;
    el.title = m.id + '.obj';
    el.onclick = () => show(i);
    list.append(el);
  });
  const done = models.filter(m => notes[m.id]?.s).length;
  $('prog').textContent = `Проверено ${done} из ${models.length} · проблем: ${models.filter(m => notes[m.id]?.s === 'bad').length}`;
  $('progbar').style.width = (100 * done / models.length) + '%';
  list.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
}

function renderNote() {
  const n = noteOf(models[idx].id);
  $('note').value = n.t;
  document.querySelectorAll('.status .btn').forEach(b => b.classList.toggle('on', b.dataset.s === n.s));
}

$('note').addEventListener('input', e => {
  const n = noteOf(models[idx].id);
  const had = !!n.t; n.t = e.target.value;
  if (n.t.trim() && !n.s) n.s = 'bad';
  save(); if (had !== !!n.t || n.s) renderList(); renderNote_status();
});
function renderNote_status() {
  const n = noteOf(models[idx].id);
  document.querySelectorAll('.status .btn').forEach(b => b.classList.toggle('on', b.dataset.s === n.s));
}
document.querySelectorAll('.status .btn').forEach(b => b.onclick = () => {
  const n = noteOf(models[idx].id);
  n.s = n.s === b.dataset.s ? '' : b.dataset.s;
  save(); renderList(); renderNote_status();
});
CHIPS.forEach(c => {
  const el = document.createElement('button');
  el.className = 'chip'; el.textContent = c;
  el.onclick = () => {
    const ta = $('note');
    ta.value = (ta.value.trim() ? ta.value.replace(/\s*$/, '\n') : '') + '- ' + c + ': ';
    ta.dispatchEvent(new Event('input'));
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  };
  $('chips').append(el);
});

// ---------- отчёт ----------
function buildReport() {
  const bad = models.filter(m => notes[m.id]?.s === 'bad' || (notes[m.id]?.t || '').trim());
  const ok = models.filter(m => notes[m.id]?.s === 'ok' && !(notes[m.id]?.t || '').trim());
  const unchecked = models.filter(m => !notes[m.id]?.s && !(notes[m.id]?.t || '').trim());
  const L = [];
  L.push(`# Отчёт по 3D-моделям зданий — ${new Date().toLocaleDateString('ru-RU')}`);
  L.push('');
  L.push('Модели: `Assets/Art/Models/Buildings/generated/*.obj` (генерируются `source/wi_models.py`).');
  L.push(`Проверено ${models.length - unchecked.length} из ${models.length}. С проблемами: ${bad.length}. Без замечаний: ${ok.length}.`);
  L.push('');
  if (bad.length) {
    L.push('## Что исправить');
    bad.forEach((m, i) => {
      const parts = m.parts.length ? ` (+ детали: ${m.parts.map(p => '`' + p.model + '.obj`').join(', ')})` : '';
      L.push('');
      L.push(`### ${i + 1}. ${m.label} — \`${m.id}.obj\`${parts}`);
      const t = (notes[m.id].t || '').trim();
      L.push(t || '_(помечено как проблемное, без описания)_');
    });
    L.push('');
  }
  const auto = models.filter(m => (m.warns || []).length);
  if (auto.length) {
    L.push('## Автопроверка сокетов (по префабам и BuildingRestyle.AddPorts)');
    auto.forEach(m => m.warns.forEach(w => L.push(`- ${m.label} (\`${m.prefab}\`): ${w}`)));
    L.push('');
  }
  if (ok.length) { L.push('## Без замечаний'); L.push(ok.map(m => `${m.label} (\`${m.id}\`)`).join(', ')); L.push(''); }
  if (unchecked.length) { L.push('## Не проверены'); L.push(unchecked.map(m => `${m.label} (\`${m.id}\`)`).join(', ')); }
  return L.join('\n');
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}

$('bReport').onclick = async () => {
  const text = buildReport();
  const ok = await copy(text);
  const t = $('toast');
  t.textContent = ok ? 'Отчёт скопирован в буфер обмена' : 'Браузер не дал доступ к буферу — текст ниже выделен, нажмите Ctrl+C';
  t.style.background = ok ? 'var(--ok)' : 'var(--bad)';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200);
  const fb = $('fallback'); fb.textContent = text; fb.style.display = ok ? 'none' : 'block';
  if (!ok) { const r = document.createRange(); r.selectNodeContents(fb); getSelection().removeAllRanges(); getSelection().addRange(r); }
};
$('bClear').onclick = () => {
  if (!confirm('Удалить все заметки и отметки?')) return;
  notes = Object.create(null); save(); renderList(); renderNote();
};

// ---------- управление ----------
['tPorts', 'tFoot', 'tParts', 'tWire', 'tBack', 'tGrid', 'tSpin'].forEach(id => $(id).onchange = applyToggles);
$('bReset').onclick = () => frame(true);
$('bPrev').onclick = () => show(idx - 1);
$('bNext').onclick = () => show(idx + 1);
addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === ']') show(idx + 1);
  if (e.key === 'ArrowLeft' || e.key === '[') show(idx - 1);
});

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

// простая анимация деталей: вращение / качание / мигание по имени анимации
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  for (const p of animParts) {
    const a = $('tAnim').checked ? p.userData.anim : '';
    p.rotation.set(0, 0, 0);
    p.scale.setScalar(1);
    const base = p.userData.base || (p.userData.base = p.position.clone());
    p.position.copy(base);
    if (/Drill|Hub|Turret|Dish|Turbine|Coils|Valve/.test(a)) p.rotation.y = t * (/Drill|Turbine/.test(a) ? 4 : 1);
    else if (/Crank/.test(a)) p.rotation.x = t * 2;
    else if (/Beam/.test(a)) p.rotation.x = Math.sin(t * 2) * 0.35;
    else if (/Carriage|Trolley/.test(a)) p.position.x = base.x + Math.sin(t * 1.5) * 0.3;
    else if (/Beacon|Flame/.test(a)) p.scale.setScalar(1 + Math.sin(t * 6) * 0.15);
  }
  controls.update();
  renderer.render(scene, camera);
});

resize();
show(0);
</script>
